# Manually seed the Studio (Strapi) content store — the fast, repeatable alternative to running
# scripts/seed.js from a laptop (home → Azure at concurrency 8 took ~40 min; a runner co-located with
# Azure at higher concurrency is a few minutes). Triggered by hand from the Actions tab.
#
# Self-sufficient: scripts/seed.js now reads the COMMITTED world-bundle snapshot
# (civstudio-engine/src/test/resources/world-bundle.json.gz) by default — NOT the gitignored generated/
# tree — so a clean checkout has everything it needs (generated/ is only local exporter build-scratch).
# And studio/.env is gitignored → absent in the checkout, so Strapi reads DATABASE_* straight from this
# job's env (no .env override to fight) and the seeder connects directly to Postgres (no bundle token).
#
# One-time setup — add these repo secrets (Settings → Secrets and variables → Actions):
#   STUDIO_DB_HOST      e.g. civstudio-postgres.postgres.database.azure.com
#   STUDIO_DB_NAME      e.g. postgres
#   STUDIO_DB_USER      e.g. eu
#   STUDIO_DB_PASSWORD  the prod DB password
# (Optionally gate this behind a protected GitHub Environment named "production" for a review step.)

name: Seed Studio

on:
  workflow_dispatch: {}
  # Uses seed.js --bulk (raw batch INSERT): always a clean wipe+reseed, ~65k per-row round-trips
  # collapsed to a few hundred, so it's fast even transatlantic (runner in the US, DB in Belgium).

# Never let two seeds race the same DB.
concurrency:
  group: seed-studio
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production # add required reviewers here to gate prod seeds
    env:
      # DB target — from repo secrets (no .env in the checkout, so these win)
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${{ secrets.STUDIO_DB_HOST }}
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${{ secrets.STUDIO_DB_NAME }}
      DATABASE_USERNAME: ${{ secrets.STUDIO_DB_USER }}
      DATABASE_PASSWORD: ${{ secrets.STUDIO_DB_PASSWORD }}
      DATABASE_SSL: 'true'
      DATABASE_SSL_REJECT_UNAUTHORIZED: 'false' # Azure cert chain
      DATABASE_POOL_MAX: '20'
      # Strapi boot requires these present; the seeder never uses them, so ephemeral values are fine.
      APP_KEYS: 'ci-seed-1,ci-seed-2'
      API_TOKEN_SALT: 'ci-seed-api-token-salt'
      ADMIN_JWT_SECRET: 'ci-seed-admin-jwt'
      TRANSFER_TOKEN_SALT: 'ci-seed-transfer-salt'
      JWT_SECRET: 'ci-seed-jwt'
      ENCRYPTION_KEY: 'ci-seed-encryption-key'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install studio dependencies
        working-directory: studio
        run: npm ci

      # Guard the guard. This job's only safety net is the world check below; if its logic is
      # broken, a bad seed sails through looking green — which is the exact failure mode the check
      # was written for. Pure and fast (~200 ms), so it runs BEFORE anything touches the database.
      - name: Unit-test the world invariants
        run: node --test tools/*.test.mjs

      - name: Seed
        working-directory: studio
        run: node scripts/seed.js --bulk

      # A seed writes ROWS. It does not change what anybody sees, because the bundle is cached twice
      # downstream — Strapi's projection cache (module-scoped, keyed by contentVersion) and
      # civstudio-server's static one. On 2026-07-27 a clean reseed reported success while prod kept
      # serving the pre-realm-split world and the live map read "Cannor: 0 provinces". "Seed
      # succeeded" was true and useless.
      #
      # This job cannot fix that itself: the subscription is reached by a guest identity that cannot
      # create role assignments, so there is no CI service principal to restart the container apps
      # with (the same reason deploys are local). What it CAN do is check, and say so loudly.
      - name: Does the live world reflect this seed?
        id: worldcheck
        continue-on-error: true   # the caches are expected stale here; the summary below is the point
        run: node tools/verify-world.mjs https://dev.civstudio.com

      - name: Next steps
        if: always()
        run: |
          {
            echo "## Seed complete"
            echo
            if [ "${{ steps.worldcheck.outcome }}" = "success" ]; then
              echo "The live world already reflects this seed — nothing further to do."
            else
              echo "**The live world does NOT reflect this seed yet.** Expected: the bundle is cached"
              echo "by Strapi (keyed by \`contentVersion\`) and again by the server (static per boot)."
              echo "Both are process-scoped, so both need a restart — **Strapi first**, or the server"
              echo "just re-fetches the stale bytes."
              echo
              echo 'Run this from a box with an authenticated `az` session:'
              echo
              echo '```powershell'
              echo 'pwsh tools/refresh-content.ps1'
              echo '```'
              echo
              echo "It restarts both revisions in order and re-runs the world invariants."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
