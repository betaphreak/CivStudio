name: CivStudio Web

# The web/ site is a fully prebuilt static folder: the baked assets (web/assets/*.webp, a few MB)
# are committed to git, non-LFS. So this job just uploads the folder as-is — no Java engine, no
# web/build.mjs, no LFS. Per-plot terrain is NOT a static asset any more: the server generates and
# serves it per province at GET /api/plots/{id} (docs/plot-serving.md), so there is no plots.pack.
# Regenerate the baked assets locally with `node web/build.mjs` and commit the result; the deploy
# ships exactly what is checked in. See web/README.md "Deploy".
on:
  push:
    branches: [master]
    paths:
      - 'web/**'                              # any change to the committed site or its baked assets
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      skip_server_check:
        description: 'Ship web even if the deployed server is older than this commit'
        type: boolean
        default: false

# never let two deploys race; the newest push wins
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the server-ordering check below walks history (merge-base --is-ancestor)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ORDERING GATE. This site auto-deploys on every master push; the server is rolled by hand, so
      # a push touching both ships the frontend NOW and the backend whenever someone gets to it. On
      # 2026-07-27 the six-realm split did exactly that — web went live at 06:51 against the previous
      # day's server, and the mismatch sat unnoticed for hours. "Deploy the server first" was a line
      # in CLAUDE.md and nothing enforced it.
      #
      # It does not demand a fully up-to-date server (that would block a CSS fix over an unrelated
      # backend commit, and a check people route around is worse than none). It demands only that the
      # running server already contains the newest SERVER-AFFECTING commit up to this one — so
      # web-only pushes sail through and mixed pushes wait for their backend.
      #
      # Fails closed: an unreachable server or an unrecognisable build stamp cannot prove the pairing
      # is safe. Override with the workflow_dispatch input, or `[skip server-check]` in the commit
      # message for a push you know is frontend-only.
      - name: Server is not behind this build
        if: >-
          ${{ inputs.skip_server_check != true
              && !contains(github.event.head_commit.message, '[skip server-check]') }}
        run: node tools/verify-server-ahead.mjs --base https://dev.civstudio.com --ref "$GITHUB_SHA"

      # The web unit tests (node:test, no dependencies — the site is dependency-free and so are its
      # tests, so this needs no npm install). They gate the deploy: the pure modules under test are
      # the ones nothing else can catch — the band spine every layer fades through (band-math), the
      # river/route tiling geometry — and an untriggered test rots.
      - name: Unit tests
        working-directory: web
        run: npm test

      # Deploy the prebuilt web/ folder with the Static Web Apps CLI (a plain Node tool) rather than
      # the Azure/static-web-apps-deploy Docker action: no container image to pull, and it runs on any
      # glibc Linux runner. Uploads ./web as-is (no build). The CLI reads the deployment token from
      # SWA_CLI_DEPLOYMENT_TOKEN; --env production targets the live environment (a master push).
      # NPM_CONFIG_LOGLEVEL=error mutes npm's deprecation warnings for the CLI's own transitive deps
      # (inflight/glob/rimraf/… — nothing we can fix here), keeping the deploy log clean.
      - name: Deploy to Azure Static Web Apps
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
        run: npx -y @azure/static-web-apps-cli@2 deploy ./web --env production
