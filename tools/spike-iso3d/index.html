<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eos — iso/3D terrain spike</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e15;color:#dfe6f2;
    font:12px/1.45 system-ui,'Segoe UI',sans-serif;overflow:hidden}
  #cv{position:absolute;inset:0;display:block}
  #panel{position:absolute;top:0;left:0;width:264px;max-height:100%;overflow-y:auto;
    background:rgba(14,19,28,.92);border-right:1px solid #232c3c;padding:12px 14px;z-index:2}
  h1{font:700 13px system-ui;margin:0 0 2px;letter-spacing:.02em}
  .sub{color:#8b95a8;margin:0 0 12px;font-size:11px}
  .sec{font:700 10px system-ui;letter-spacing:.10em;text-transform:uppercase;color:#7c8aa2;
    margin:14px 0 6px;border-top:1px solid rgba(190,205,230,.10);padding-top:10px}
  .sec:first-of-type{border-top:0;padding-top:0}
  label{display:block;margin:7px 0}
  .row{display:flex;align-items:center;gap:8px}
  .row span:first-child{flex:1 1 auto;color:#b7c2d6}
  .val{font-variant-numeric:tabular-nums;color:#e8c37a;min-width:42px;text-align:right}
  input[type=range]{width:100%;margin:2px 0 0}
  button{font:600 11px system-ui;color:#dfe6f2;background:rgba(190,205,230,.10);
    border:1px solid rgba(190,205,230,.20);border-radius:7px;padding:5px 9px;cursor:pointer}
  button:hover{background:rgba(190,205,230,.20)}
  button[aria-pressed=true]{background:rgba(232,195,122,.20);border-color:#e8c37a;color:#f6e3bd}
  .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  #stats{color:#8b95a8;font-size:11px;margin-top:12px;white-space:pre-line}
  #err{color:#ff8a8a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel">
  <h1>iso/3D terrain spike</h1>
  <p class="sub">One real province: its baked <code>_tcanvas</code> on a mesh built from its real
    <code>plotType</code> + <code>elevation</code>. Drag to orbit, wheel to zoom.</p>

  <div class="sec">Relief from plotType</div>
  <label><span class="row"><span>PEAK height</span><span class="val" id="vPeak"></span></span>
    <input type="range" id="peak" min="0" max="8" step="0.1"></label>
  <label><span class="row"><span>HILL height</span><span class="val" id="vHill"></span></span>
    <input type="range" id="hill" min="0" max="4" step="0.05"></label>

  <div class="sec">Relief from the heightmap</div>
  <label><span class="row"><span>elevation &times;</span><span class="val" id="vElev"></span></span>
    <input type="range" id="elev" min="0" max="40" step="0.5"></label>

  <div class="sec">Shape</div>
  <label><span class="row"><span>smoothing passes</span><span class="val" id="vSmooth"></span></span>
    <input type="range" id="smooth" min="0" max="6" step="1"></label>

  <div class="sec">Light</div>
  <label><span class="row"><span>sun azimuth</span><span class="val" id="vAz"></span></span>
    <input type="range" id="az" min="0" max="360" step="1"></label>
  <label><span class="row"><span>sun altitude</span><span class="val" id="vAlt"></span></span>
    <input type="range" id="alt" min="5" max="89" step="1"></label>
  <label><span class="row"><span>ambient</span><span class="val" id="vAmb"></span></span>
    <input type="range" id="amb" min="0" max="1" step="0.02"></label>

  <div class="sec">Compare</div>
  <div class="btns">
    <button id="bFlat" aria-pressed="false">Flat (no relief)</button>
    <button id="bWire" aria-pressed="false">Wireframe</button>
    <button id="bTex" aria-pressed="true">Texture</button>
    <button id="bTop" >Top-down</button>
    <button id="bObl" >Oblique</button>
  </div>
  <div class="btns">
    <button id="bCiv">Civ4-ish preset</button>
    <button id="bHeight">Heightmap only</button>
  </div>
  <div id="stats"></div>
  <div id="err"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
<script type="module" src="./iso3d.mjs"></script>
</body>
</html>
